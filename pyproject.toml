[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scientific-library-rag"
version = "1.0.0"
description = "Biblioteca Científica Offline con Sistema RAG Local - FastAPI + LanceDB + BGE-M3 + Ollama"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Scientific Library Team" }
]
keywords = [
    "rag",
    "scientific-papers",
    "offline",
    "lancedb",
    "ollama",
    "embeddings",
    "bge-m3"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # Vector Database
    "lancedb>=0.4.0",
    "pyarrow>=14.0.0",

    # LLM & Embeddings
    "ollama>=0.1.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",

    # PDF Processing
    "pymupdf4llm>=0.0.5",
    "pymupdf>=1.23.0",

    # HTTP Client
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",

    # Data Processing
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",

    # Database
    "aiosqlite>=0.19.0",

    # Caching
    "cachetools>=5.3.0",
    "diskcache>=5.6.0",

    # Frontend
    "streamlit>=1.30.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
nougat = [
    "nougat-ocr>=0.1.0",
]

[project.scripts]
sci-library = "app.main:main"
sci-ingest = "app.cli.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
